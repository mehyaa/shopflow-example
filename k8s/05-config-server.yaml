apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: shopflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: shopflow/config-server:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # "native" must be included: SPRING_PROFILES_ACTIVE overrides application.yml
            - name: SPRING_PROFILES_ACTIVE
              value: docker,native
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: shopflow
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
