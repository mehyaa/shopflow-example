# Business services (SPEC §2): product (8081), inventory (8082), order (8083),
# payment (8084), notification (8085). Images are built by the business-services agent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: shopflow/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka
            # Tokens are fetched via `kubectl port-forward svc/keycloak 8180:8080`;
            # iss follows the request URL, JWKS via the in-cluster service name.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://localhost:8180/realms/shopflow
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/shopflow/protocol/openid-connect/certs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/products
            - name: SPRING_DATASOURCE_USERNAME
              value: shopflow
            - name: SPRING_DATASOURCE_PASSWORD
              value: shopflow
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  selector:
    app: product-service
  ports:
    - port: 8081
      targetPort: 8081
---
