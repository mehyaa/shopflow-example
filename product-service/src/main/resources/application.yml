server:
  port: 8081

spring:
  application:
    name: product-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/products
    username: shopflow
    password: shopflow
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          # Day 5: Keycloak issuer for the shopflow realm
          issuer-uri: http://localhost:8180/realms/shopflow

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/products

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
