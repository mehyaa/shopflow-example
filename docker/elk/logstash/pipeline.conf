# ShopFlow ELK demo pipeline (docker/elk/logstash/pipeline.conf)
# logspout streams every container's stdout to this UDP port as plain text lines;
# the json codec parses Spring Boot's LogstashEncoder output into fields
# (timestamp, level, logger_name, message, ...) so Kibana can query them.
input {
  udp { port => 5000 codec => json }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shopflow-logs-%{+YYYY.MM.dd}"
  }
}
