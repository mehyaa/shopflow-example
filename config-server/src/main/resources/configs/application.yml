eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Day 3 lab speed (default 30 in production): keeps "instance not visible" stalls short
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
spring:
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh
---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
