server:
  port: 8080
spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/shopflow
  cloud:
    gateway:
      routes:
      - id: product-service
        uri: lb://product-service
        predicates:
        - Path=/api/products/**
      - id: inventory-service
        uri: lb://inventory-service
        predicates:
        - Path=/api/inventory/**
      - id: order-service
        uri: lb://order-service
        predicates:
        - Path=/api/orders/**
      - id: payment-service
        uri: lb://payment-service
        predicates:
        - Path=/api/payments/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/shopflow
          jwk-set-uri: http://keycloak:8080/realms/shopflow/protocol/openid-connect/certs
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
